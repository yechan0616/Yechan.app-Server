spring:
  application:
    name: yechan-server
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  autoconfigure:
    # No default in-memory user; administrators sign in with passkeys or their own password.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

server:
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1KB
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cors:
    public-origins:
      - https://www.yechan.app
      - https://studio.yechan.app
    studio-origins:
      - https://studio.yechan.app
  content:
    locales:
      supported: [en, ko]
      default: en
  media:
    public-base-url: https://cdn.yechan.app
    max-file-size: 20MB
    storage:
      region: auto
      bucket: yechan-media
      path-style: true
  auth:
    relying-party:
      id: yechan.app
      name: yechan.app Studio
      origins:
        - https://studio.yechan.app
    session:
      cookie-name: __Host-studio_session
      secure-cookie: true
      idle-timeout: 7d
      absolute-timeout: 30d
    ceremony-ttl: 5m
