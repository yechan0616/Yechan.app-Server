spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # Trust X-Forwarded-* from cloudflared on the private container network.
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    setup-token: ${AUTH_SETUP_TOKEN:}
