spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # Trust X-Forwarded-* from cloudflared on the private container network.
  forward-headers-strategy: native

logging:
  level:
    root: info
    org.hibernate: warn
    software.amazon.awssdk: warn

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL}
    storage:
      endpoint: ${MEDIA_S3_ENDPOINT}
      bucket: ${MEDIA_S3_BUCKET}
      access-key-id: ${MEDIA_S3_ACCESS_KEY_ID}
      secret-access-key: ${MEDIA_S3_SECRET_ACCESS_KEY}
  auth:
    setup-token: ${AUTH_SETUP_TOKEN:}
