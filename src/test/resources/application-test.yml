springdoc:
  api-docs:
    enabled: true

app:
  media:
    max-file-size: 1MB
    public-base-url: http://localhost:1/yechan-media
    storage:
      endpoint: http://localhost:1
      region: us-east-1
      access-key-id: test
      secret-access-key: test
  auth:
    relying-party:
      id: localhost
      origins:
        - http://localhost:3001
    session:
      cookie-name: studio_session
      secure-cookie: false
    setup-token: test-setup-token-0123456789abcdef0123
