# Dev services for ./gradlew bootRun. The full stack in Docker:
#   SEED_BUNDLE=/seed/portfolio docker compose -f deploy/compose.local.yaml --profile app up -d --build
name: yechan-local

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=yechan'
      - 'POSTGRES_USER=yechan'
      - 'POSTGRES_PASSWORD=yechan-local'
      - 'TZ=UTC'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yechan -d yechan']
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: 'adobe/s3mock:5.2.3'
    environment:
      - 'COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/home/cnb/store'
      - 'COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - 's3-data:/home/cnb'

  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yechan
      SPRING_DATASOURCE_USERNAME: yechan
      SPRING_DATASOURCE_PASSWORD: yechan-local
      APP_MEDIA_STORAGE_ENDPOINT: http://s3:9090
      APP_SEED_BUNDLE: ${SEED_BUNDLE:-}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - '../seed:/seed:ro'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

volumes:
  postgres-data:
  s3-data:
